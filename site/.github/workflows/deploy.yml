# Deploy to GitHub Pages (dormant until the repo exists — SETUP.md Step 5)
#
# Activation checklist (when ready to go live):
#   1. Push this project to a GitHub repository.
#   2. Repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
#   3. Edit astro.config.mjs: set `site` to 'https://<username>.github.io'
#      and `base` to '/<repository-name>'.
#   4. Push to main — this workflow builds and deploys automatically.
#
# Security notes (project constraint):
#   - Minimal permissions: contents:read + pages:write only.
#   - No secrets required; deployment uses the built-in GITHUB_TOKEN.
#   - Dependency versions come from the committed package-lock.json (npm ci).

name: Deploy to GitHub Pages

on:
  # Run on every push to main.
  push:
    branches: [main]
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; don't cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        working-directory: site

      - name: Install tsx (schema validator runner)
        run: npm ci
        working-directory: site

      - name: Validate data schemas
        run: npx tsx src/schemas/validate.ts
        working-directory: site

      - name: Build
        run: npm run build
        working-directory: site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
